# NyxDeck — kitty base configuration.
#
# The colours are DMS's: its matugen rewrites both dank files on every wallpaper
# and theme change. They do not exist until the first theme generation, and
# kitty only warns about a missing include, so everything below applies anyway.

# ── DMS-owned ────────────────────────────────────────────────────────────────
# current-theme.conf is the NyxDeck indirection: it pulls in dank-theme.conf.
include current-theme.conf
include dank-tabs.conf

# ── Appearance ───────────────────────────────────────────────────────────────
window_padding_width 5
hide_window_decorations yes
background_opacity 0.75
# The Nerd Font family: it is what ttf-jetbrains-mono-nerd (a core dependency)
# installs, and the prompt and the file managers draw their icons from it.
font_family JetBrainsMono Nerd Font Mono
font_size 12.0
remember_window_size no
confirm_os_window_close 0
cursor_trail 1
cursor_shape block
shell_integration no-cursor
shell fish

# ── Windows-like shortcuts ───────────────────────────────────────────────────
# Copy the selection, or pass Ctrl+C through to interrupt the program.
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard

# Word deletion.
map ctrl+backspace send_text all \x17
map ctrl+delete send_text all \x1bd

# Select all: the whole scrollback into the clipboard.
map ctrl+a pipe @text clipboard sh -c "wl-copy 2>/dev/null || xclip -selection clipboard"

# Font size, browser-style.
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
mouse_map ctrl+scroll_up change_font_size all +1.0
mouse_map ctrl+scroll_down change_font_size all -1.0

# ── User additions ───────────────────────────────────────────────────────────
# Preserved across deploys; this file is yours.
include __custom__.conf
