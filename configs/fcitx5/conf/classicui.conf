# fcitx5 reads # as a comment.
#
# The theme DMS generates from the wallpaper palette (Theme → templates →
# fcitx5). Selecting it here is what makes the input panel follow the colours;
# the theme files themselves are DMS' own output under
# ~/.local/share/fcitx5/themes/dms/ and are never deployed from this repository.
Theme=dms
DarkTheme=dms
Font="Noto Sans CJK SC 14"
